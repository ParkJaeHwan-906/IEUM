spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: IEUM

  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ieum}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true"
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: IeumHikariPool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 10
      connection-timeout: 3000
      validation-timeout: 2000
      max-lifetime: 270000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 2000ms
        shutdown-timeout: 200ms

  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:debug}
    org.hibernate.orm.jdbc.bind: ${SQL_BIND_LOG_LEVEL:trace}
