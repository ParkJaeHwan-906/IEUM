# IEUM 로컬 관측용 Prometheus 설정
# 두 Spring Boot 서버는 호스트에서 돌고, Prometheus 는 컨테이너에서 host.docker.internal 로 긁는다.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ieum-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "host.docker.internal:8080" ]
        labels:
          service: ieum-api

  - job_name: ieum-auth
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "host.docker.internal:8081" ]
        labels:
          service: ieum-auth
