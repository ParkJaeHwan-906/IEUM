# monitoring/grafana/dashboards 의 JSON 을 IEUM 폴더에 올린다. 파일을 고치면 30초 안에 다시 읽는다
apiVersion: 1

providers:
  - name: ieum
    folder: IEUM
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
