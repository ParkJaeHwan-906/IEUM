spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ieum-auth

  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ieum}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: IeumAuthHikariPool
      maximum-pool-size: ${AUTH_DB_POOL_SIZE:5}
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 2000
      max-lifetime: 270000

  flyway:
    # 스키마는 ieum-domain 의 db/migration 이 관리한다. 두 서버가 같은 스크립트를 읽고, 동시에 떠도 Flyway 잠금으로 한쪽만 적용
    locations: classpath:db/migration
    # Flyway 도입 전부터 테이블이 있던 DB 는 V1(baseline) 을 건너뛰고 V2 부터 적용
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      connect-timeout: 2000ms

  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${AUTH_SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        # Prometheus 가 /actuator/prometheus 를 긁어 간다 (IEUM_BE/monitoring)
        include: health,prometheus

ieum:
  auth:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    private-key: ${JWT_PRIVATE_KEY:}
    # 교체 전 키(Base64 PKCS#8). 쉼표로 여러 개. 공개 부분만 JWKS 에 실리며 access-token-ttl 이 지나면 비운다
    previous-keys: ${JWT_PREVIOUS_KEYS:}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P14D}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:debug}
    org.hibernate.orm.jdbc.bind: ${SQL_BIND_LOG_LEVEL:trace}
