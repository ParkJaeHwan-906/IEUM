spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: IEUM

  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ieum}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true"
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: IeumHikariPool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 10
      connection-timeout: 3000
      validation-timeout: 2000
      max-lifetime: 270000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 2000ms
        shutdown-timeout: 200ms

  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

  mvc:
    problemdetails:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:http://localhost:8081}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

ieum:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  stock:
    # 재고 차감 전략: naive | pessimistic | optimistic | conditional | redis | synchronized (TODO 2.1 의 비교)
    strategy: ${STOCK_STRATEGY:naive}
    # synchronized 전략의 락 범위. create(예약 생성 트랜잭션 전체, 정합성 성립) | deduct(차감 메서드만, 커밋 전에 풀려 초과 예약)
    synchronized-scope: ${STOCK_SYNC_SCOPE:create}
  order:
    # READY_FOR_PICKUP 진입 후 이 시간이 지나면 EXPIRED, 재고 복구
    pickup-ttl: ${PICKUP_TTL:PT15M}
    # PENDING 이 이 시간 동안 승인되지 않으면 CANCELED, 재고 복구 (PendingTimeoutJob)
    approval-timeout: ${APPROVAL_TIMEOUT:PT5M}
    # PendingTimeoutJob 이 DB 에서 시간이 지난 PENDING 을 찾는 주기. 실제 취소 시점은 approval-timeout ~ approval-timeout + 이 값
    approval-timeout-poll-interval: ${APPROVAL_TIMEOUT_POLL_INTERVAL:PT10S}
    retry:
      max-attempts: ${STOCK_RETRY_MAX_ATTEMPTS:3}
      backoff: ${STOCK_RETRY_BACKOFF:PT0.01S}
    idempotency:
      # 확정된 멱등키(주문 id) 보존 기간. redis 전략은 Redis 키 TTL, 그 외 전략은 DB unique 로 영구 보존
      ttl: ${IDEMPOTENCY_TTL:P1D}
      # redis 전략에서 Lua 판정 후 커밋 전까지의 PENDING 표식 수명. 그 사이 서버가 죽어도 이 시간 뒤 같은 키로 재시도 가능
      pending-ttl: ${IDEMPOTENCY_PENDING_TTL:PT30S}
    # redis 전략에서 판매 조건(마감 시각·영업 종료) 을 DB 커넥션 없이 판정하기 위한 캐시 수명. 변경이 반영되는 최대 지연
    item-cache-ttl: ${ITEM_CACHE_TTL:PT5S}
    expiry:
      # ExpiryWorker 가 orders:expiry Sorted Set 을 훑는 주기
      poll-interval: ${EXPIRY_POLL_INTERVAL:PT5S}
    reconciliation:
      # redis 전략에서 stock:{itemId} 를 DB 주문 상태로 대조하는 주기
      interval: ${RECONCILIATION_INTERVAL:PT60S}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:debug}
    org.hibernate.orm.jdbc.bind: ${SQL_BIND_LOG_LEVEL:trace}
